<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnonVibes</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700">
    <h1 class="text-2xl font-bold text-center mb-1 text-indigo-400">AnonVibes 🤫</h1>
    <p class="text-slate-400 text-sm text-center mb-6">Отправь анонимное сообщение</p>

    <textarea 
      id="messageInput" 
      rows="4" 
      class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 mb-4"
      placeholder="Напиши что-нибудь искреннее..."></textarea>

    <button 
      onclick="sendMessage()" 
      id="sendBtn" 
      class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl transition duration-200 shadow-lg">
      Отправить анонимно 🚀
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    let targetUserId = urlParams.get('startapp');

    if (!targetUserId && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      targetUserId = tg.initDataUnsafe.start_param;
    }

    if (!targetUserId) {
      alert("Получатель не указан. Откройте ссылку от друга.");
    }

    async function sendMessage() {
      const text = document.getElementById('messageInput').value.trim();
      if (!text) {
        tg.showAlert('Введите текст сообщения!');
        return;
      }

      if (!targetUserId) {
        tg.showAlert('Ошибка: получатель не определен!');
        return;
      }

      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;
      sendBtn.innerText = 'Отправка...';

      try {
        const response = await fetch('/api/send-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ recipient_id: targetUserId, message: text })
        });

        const result = await response.json();
        if (result.success) {
          tg.showAlert('Сообщение отправлено!');
          tg.close();
        } else {
          tg.showAlert('Ошибка отправки.');
        }
      } catch (err) {
        tg.showAlert('Сообщение отправлено!');
        tg.close();
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = 'Отправить анонимно 🚀';
      }
    }
  </script>
</body>
</html>
